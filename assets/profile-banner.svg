  <path d="M900 0 C980 100 980 240 1100 360" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".22"/>
  <rect x="74" y="72" width="8" height="216" rx="4" fill="url(#accent)"/>
  <text x="112" y="154" fill="#F8FAFC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="58" font-weight="750" letter-spacing="-1.8">ORYANDA SAPUTRA</text>
