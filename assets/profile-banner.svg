  <text x="116" y="250" fill="#94A3B8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="18" letter-spacing="1.1">WEB APPLICATIONS  •  DATA-DRIVEN SOLUTIONS  •  CONTINUOUS LEARNING</text>
  <g transform="translate(1010 135)">
