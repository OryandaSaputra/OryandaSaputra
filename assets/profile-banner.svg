    <path d="M59 56 H113" stroke="#E2E8F0" stroke-width="4" stroke-linecap="round" opacity=".75"/>
  </g>
  <text x="116" y="318" fill="#64748B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" letter-spacing="2.3">GITHUB PROFILE</text>
