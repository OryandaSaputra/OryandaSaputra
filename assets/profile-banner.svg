<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Oryanda Saputra — Software Developer</title>
  <desc id="desc">A dark modern technology banner with blue and violet gradients.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080D1B"/>
      <stop offset="55%" stop-color="#111A35"/>
      <stop offset="100%" stop-color="#21133F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="52%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M 34 0 L 0 0 0 34" fill="none" stroke="#94A3B8" stroke-opacity=".10" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
